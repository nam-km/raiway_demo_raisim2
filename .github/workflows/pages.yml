name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # the RaiSim WebAssembly SDK is built with Emscripten 4.0.0 and programs must use the same version
      - name: Build the page
        env:
          RAIWAY_WEB_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.0
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          web/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/site
      - id: deployment
        uses: actions/deploy-pages@v4
